<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Hub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>SHC Work Hub</title>
<!--
  SHC Work Hub のスマホ版。データはこのページには置かない。
  読み書きするのは、自分の Dropbox の「Apps/SHC Work Hub」フォルダだけ（Dropbox の App folder の許可）。
    読む：/phone/snapshot.json（PC の SHC Work Hub が書く：勤務・ガソリン代・タイムシート・出張・立替・月報・やること）
    書く：/inbox/<日時>.json（1件＝1つの頼み。PC が取り込む）、/receipts/<日時>_<名前>（領収書の写真・PDF）
-->
<style>
:root{
  --bg:#f3f5f9; --surface:#fff; --ink:#172033; --ink-soft:#4a5468; --ink-faint:#7b8496; --line:#e2e6ee;
  --brand:#14213d; --accent:#2f6fde; --accent-soft:#e6eefc;
  --trip:#0f766e; --trip-soft:#e0f2ef; --work:#2f6fde; --work-soft:#e6eefc; --off:#7b8496; --off-soft:#eef0f4; --leave:#a15c07; --leave-soft:#fdf0dc;
  --warn:#b45309; --warn-soft:#fff4e0; --ok:#15803d; --ok-soft:#e3f5e8; --err:#b91c1c; --err-soft:#fde8e8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#172033; --ink:#e8ecf4; --ink-soft:#b6bfd0; --ink-faint:#8791a6; --line:#2a3550;
  --brand:#0b1222; --accent:#6a9cf5; --accent-soft:#1e2c4a;
  --trip:#4fd1bf; --trip-soft:#123a36; --work:#6a9cf5; --work-soft:#1e2c4a; --off:#8791a6; --off-soft:#222b40; --leave:#f0b25a; --leave-soft:#3a2b12;
  --warn:#f0b25a; --warn-soft:#3a2b12; --ok:#4ade80; --ok-soft:#173523; --err:#f87171; --err-soft:#3a1717;
}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#172033; --ink:#e8ecf4; --ink-soft:#b6bfd0; --ink-faint:#8791a6; --line:#2a3550;
  --brand:#0b1222; --accent:#6a9cf5; --accent-soft:#1e2c4a;
  --trip:#4fd1bf; --trip-soft:#123a36; --work:#6a9cf5; --work-soft:#1e2c4a; --off:#8791a6; --off-soft:#222b40; --leave:#f0b25a; --leave-soft:#3a2b12;
  --warn:#f0b25a; --warn-soft:#3a2b12; --ok:#4ade80; --ok-soft:#173523; --err:#f87171; --err-soft:#3a1717;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;flex:1;min-width:0}
header h1 small{display:block;font-size:11.5px;font-weight:400;opacity:.75}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;font-size:14px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--ink-faint);position:relative;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--err);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(10,20,40,.05)}
.muted{color:var(--ink-faint)} .small{font-size:13px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.err{background:var(--err-soft);color:var(--err)}
.meta{font-size:12.5px;color:var(--ink-faint);margin:0 4px 8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);margin:16px 4px 8px;letter-spacing:.02em}
.sec .tot{font-weight:600;font-size:12.5px}
.sec .tot.ok{color:var(--ok)} .sec .tot.warn{color:var(--warn)}
.day{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.d-date{width:52px;flex:none;text-align:center}
.d-date b{display:block;font-size:20px;line-height:1.1}
.d-date span{font-size:12px;color:var(--ink-faint)}
.d-date.sun span,.d-date.sat span{color:var(--err)}
.d-body{flex:1;min-width:0}
.d-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.k-出張{background:var(--trip-soft);color:var(--trip)} .k-出勤{background:var(--work-soft);color:var(--work)}
.k-休日{background:var(--off-soft);color:var(--off)} .k-有給休暇,.k-代休,.k-特別休暇{background:var(--leave-soft);color:var(--leave)}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-wait{background:var(--accent-soft);color:var(--accent)}
.place{font-size:14px;font-weight:600}
.desc{font-size:14px;color:var(--ink-soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc.none{color:var(--warn)}
.sub{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-soft);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;margin-top:4px}
.st.wait{color:var(--warn)} .st.sent{color:var(--accent)}
.ot{flex:none;text-align:right;font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
.ot b{color:var(--ink);font-size:14px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btns .btn{flex:1 1 auto}
.more{width:100%;background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--ink-soft)}
.t-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t-h b{font-size:16px}
.seg-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.seg-row .place{flex:1;min-width:120px}
.seg-row input{width:120px}
.amt{font-size:20px;font-weight:700;white-space:nowrap}
.todo{display:flex;gap:10px;align-items:flex-start}
.todo svg{flex:none;margin-top:2px}
.todo.warn svg{color:var(--warn)} .todo.info svg{color:var(--accent)}
/* 入力の部品 */
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-size:14.5px;font-weight:600;min-height:44px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
textarea.t{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 label.f,.row2 label.f{margin-top:10px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.step button{width:46px;height:46px;border:0;background:transparent;font-size:22px;font-weight:600;color:var(--accent)}
.step output{flex:1;text-align:center;font-weight:700;font-size:17px}
.hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px}
.part{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.part-h{font-weight:700;font-size:15px}
details.part summary{font-weight:700;font-size:15px;cursor:pointer;list-style:none}
details.part summary::after{content:' ▾';color:var(--ink-faint)}
details.part[open] summary::after{content:' ▴'}
.cnt{float:right;font-weight:400;font-size:12px;color:var(--ink-faint)}
/* 下から出る入力の画面 */
.sheet-back{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 2px;font-size:18px}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#172033;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:30;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--err)}
.login{text-align:center;padding:28px 18px}
.login h2{margin:8px 0 6px}
.login ol{text-align:left;font-size:14px;color:var(--ink-soft);padding-left:20px}
</style>
</head>
<body>
<header>
  <h1>SHC Work Hub<small id="hsub"></small></h1>
  <button class="hbtn" id="reload" type="button" hidden>更新</button>
</header>
<main id="main"><div class="card muted">読み込み中…</div></main>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-tab="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>勤務</button>
  <button type="button" data-tab="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l20-6-3-3-7 2-5-4-2 1 3 5-4 1-2-1-1 1z"/><path d="M3 21h18"/></svg>出張</button>
  <button type="button" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 6V4h12v2"/></svg>立替</button>
  <button type="button" data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>月報</button>
  <button type="button" data-tab="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>やること</button>
</nav>
<input type="file" id="rcFile" accept="image/*,application/pdf" multiple hidden>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== 設定（Dropbox に登録したアプリの App key。秘密の値ではない） ===== */
const APP_KEY = 'tub34gslfb90q4k';
/* ======================================================================= */
const REDIRECT = location.origin + location.pathname;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 保存場所：このスマホのブラウザだけ（ほかの人には見えない）。読めない設定のブラウザでも動くように try で囲む
const LS = { get(k, d) { try { const v = localStorage.getItem('wh.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('wh.' + k, JSON.stringify(v)); } catch { /* 保存できなくても動く */ } }, del(k) { try { localStorage.removeItem('wh.' + k); } catch { /* なし */ } } };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const localIso = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (iso, n) => { const x = new Date(iso + 'T00:00:00'); x.setDate(x.getDate() + n); return localIso(x); };
const md = (iso) => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}`;
const mdw = (iso) => `${md(iso)}（${WD[new Date(iso + 'T00:00:00').getDay()]}）`;
const money = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let toastT = null;
function toast(msg, kind) { const el = $('toast'); el.textContent = msg; el.className = 'toast' + (kind ? ' ' + kind : ''); el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, kind === 'err' ? 6000 : 2800); }
const ICON = {
  car: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 17h14M6 17l1.5-5h9L18 17M7 12l1.5-4h7L17 12"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>',
};

/* ---------- Dropbox のログイン（PKCE：パスワードはこのページを通らない） ---------- */
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function login() {
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
  try { sessionStorage.setItem('wh.pkce', JSON.stringify({ v, state })); } catch { /* なし */ }
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({ client_id: APP_KEY, response_type: 'code', code_challenge: ch, code_challenge_method: 'S256', redirect_uri: REDIRECT, token_access_type: 'offline', state });
}
async function finishLogin(code, state) {
  let p = null; try { p = JSON.parse(sessionStorage.getItem('wh.pkce') || 'null'); } catch { /* なし */ }
  history.replaceState(null, '', REDIRECT);
  if (!p || p.state !== state) throw new Error('ログインをやり直してください（途中で別の画面に移ったかもしれません）');
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ code, grant_type: 'authorization_code', code_verifier: p.v, client_id: APP_KEY, redirect_uri: REDIRECT }) });
  const j = await r.json();
  if (!r.ok) throw new Error('ログインできませんでした：' + (j.error_description || j.error || r.status));
  LS.set('refresh', j.refresh_token); TOKEN = { t: j.access_token, until: Date.now() + (j.expires_in - 120) * 1000 };
}
let TOKEN = null;
async function token() {
  if (TOKEN && Date.now() < TOKEN.until) return TOKEN.t;
  const rt = LS.get('refresh', null);
  if (!rt) throw Object.assign(new Error('ログインが必要です'), { login: true });
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: rt, client_id: APP_KEY }) });
  const j = await r.json();
  if (!r.ok) { if (r.status === 400 || r.status === 401) LS.del('refresh'); throw Object.assign(new Error('ログインし直してください'), { login: true }); }
  TOKEN = { t: j.access_token, until: Date.now() + (j.expires_in - 120) * 1000 };
  return TOKEN.t;
}
// Dropbox-API-Arg のヘッダーは ASCII だけ（日本語は \\u に直す）
const apiArg = (o) => JSON.stringify(o).replace(/[\u007f-￿]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
async function dbx(url, opts) {
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + await token(), ...(opts.headers || {}) } });
  if (r.status === 401) { TOKEN = null; throw Object.assign(new Error('ログインし直してください'), { login: true }); }
  return r;
}
async function download(path) {
  const r = await dbx('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { 'Dropbox-API-Arg': apiArg({ path }) } });
  if (r.status === 409) return null; // まだ無い
  if (!r.ok) throw new Error('Dropbox から読めませんでした（' + r.status + '）');
  return r.json();
}
async function uploadBytes(path, bytes) {
  const r = await dbx('https://content.dropboxapi.com/2/files/upload', { method: 'POST', headers: { 'Dropbox-API-Arg': apiArg({ path, mode: 'add', autorename: true, mute: true }), 'Content-Type': 'application/octet-stream' }, body: bytes });
  if (!r.ok) throw new Error('Dropbox に書けませんでした（' + r.status + '）');
  return r.json();
}
const upload = (path, obj) => uploadBytes(path, new TextEncoder().encode(JSON.stringify(obj, null, 1)));
async function inboxCount() {
  const r = await dbx('https://api.dropboxapi.com/2/files/list_folder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: '/inbox' }) });
  if (r.status === 409) return 0;
  if (!r.ok) return null;
  const j = await r.json();
  return j.entries.filter((e) => e['.tag'] === 'file' && /\.json$/i.test(e.name)).length;
}

/* ---------- データ ---------- */
let SNAP = LS.get('snap', null);   // PC が書いた写し（最後に読めたもの）
let MINE = LS.get('mine', {});     // このスマホで直した日の値 { date: { at, sent, 勤務実績, ガソリン代?, タイムシート用? } }（PC の写しに入るまで画面に出す）
let OPS = LS.get('ops', []);       // 日以外の頼み（出張・立替・月報・領収書）{ key, at, sent, text }
let OUTBOX = LS.get('outbox', []); // まだ Dropbox に送れていないもの（電波が無いときなど）
let WAITING = null;                // PC がまだ取り込んでいない件数
let TAB = LS.get('tab', 'work');
let SHOW_ALL = false;
let RP_YM = null;
const KEYS = ['区分', '就業場所', '工番', '業務内容', '時間外勤務', '時間外移動', '出張中休日区分'];
const TS_F = { 事務所: [['工番', 'Indirect（工番）'], ['通常', 'Regular'], ['UL', 'U/L'], ['LWOP', 'LWOP'], ['祝日', 'Holiday']], 客先: [['工番', 'Service（工番）'], ['通常', 'Regular'], ['残業週末', 'Overtime'], ['日曜祝日', 'Sun/Holiday'], ['移動', 'Travel']] };
const RP_F = [['h1', '見出し 1'], ['t1', '主な業務実績 1'], ['h2', '見出し 2'], ['t2', '主な業務実績 2'], ['h3', '見出し 3'], ['t3', '主な業務実績 3'], ['comment', '所感'], ['n1', '来月の予定 1'], ['n2', '来月の予定 2'], ['n3', '来月の予定 3']];

    MINE[date] = { at: Date.now(), sent: false, 勤務実績: { ...prev, ...edits }, ...(gasChanged ? { ガソリン代: gNow } : old.ガソリン代 ? { ガソリン代: old.ガソリン代 } : {}), ...(tsChanged ? { タイムシート用: tsNow } : old.タイムシート用 ? { タイムシート用: old.タイムシート用 } : {}) };
    S.close();
    await send({ date, 勤務実績: edits, ...(gasChanged ? { ガソリン代: gNow } : {}), ...(tsChanged ? { タイムシート用: tsNow } : {}) });
  };
}

// 領収書：写真は小さくして JPEG に（iPhone の HEIC も、ここで JPEG になる）。PDF はそのまま
let RC_TRIP = null;
function shrinkImage(file) {
  return new Promise((resolve) => {
    if (!/^image\//.test(file.type)) return resolve(null);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); resolve(b); }, 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function sendReceipts(files) {
  const t = RC_TRIP; if (!t || !files.length) return;
  const first = t.区間[0] || {};
  toast(`領収書 ${files.length} 件を送っています…`);
  let n = 0;
  for (const f of files) {
    try {
      const small = await shrinkImage(f);
      const base = (f.name || 'receipt').replace(/[\\/:*?"<>|]/g, '_').replace(/\.(heic|heif|png|jpe?g|webp)$/i, '');
      const name = `${stampNow()}_${String(n + 1).padStart(2, '0')}_${base}${small ? '.jpg' : (f.name.match(/\.[a-z0-9]+$/i) || ['.pdf'])[0]}`;
      await uploadBytes(`/receipts/${name}`, small || f);
      await send({ 操作: '領収書', start: t.start, end: t.end, place: first.就業場所 || '', file: name }, { op: `rc|${t.start}`, text: `領収書 ${n + 1} 件`, done: `領収書を送りました（${n + 1} 件）` });
      n++;
    } catch (e) { if (e.login) return renderLogin(); toast('領収書を送れませんでした（電波を確かめて、もう一度）：' + e.message, 'err'); return; }
  }
}

/* ---------- 月報 ---------- */
function renderReport() {
  const all = (SNAP && SNAP.月報) || {};
  const yms = Object.keys(all).sort();
  if (!yms.length) return '<div class="card muted">月報はまだありません（PC の SHC Work Hub を開くと入ります）</div>';
  if (!RP_YM || !all[RP_YM]) RP_YM = yms[yms.length - 1];
  const r = all[RP_YM];
  const g = r.目安 || {};
  const goal = (k) => (k[0] === 't' ? g.t : k === 'comment' ? g.comment : k[0] === 'n' ? g.n : g.h);
  const valOf = (k) => { const o = opOf(`mr|${RP_YM}|${k}`); return o ? o.value : ((r.欄 || {})[k] || {}).値 || ''; };
  return `<div class="seg two" id="r_ym">${yms.map((ym) => `<button type="button" data-ym="${ym}" class="${ym === RP_YM ? 'on' : ''}">${Number(ym.slice(5))}月</button>`).join('')}</div>` +
    `<div class="card" style="margin-top:10px">${RP_F.map(([k, l]) => { const long = k[0] === 't' || k === 'comment'; const f = (r.欄 || {})[k] || {}; const o = opOf(`mr|${RP_YM}|${k}`); return `<label class="f" for="r_${k}">${l}<span class="cnt"><span data-n="${k}">${valOf(k).length}</span>字${goal(k) ? `（目安 ${goal(k)}）` : ''}</span></label>
      ${long ? `<textarea class="t" id="r_${k}" data-k="${k}" rows="${k === 'comment' ? 6 : 4}">${esc(valOf(k))}</textarea>` : `<input class="t" id="r_${k}" data-k="${k}" value="${esc(valOf(k))}" autocomplete="off">`}
      ${o ? waitLine(o) : f.人 ? '' : (f.値 ? '<div class="hint">自動の下書きです（書き直すと、自分で書いた欄になります）</div>' : '')}`; }).join('')}
      <div class="actions"><span></span><button class="btn primary" id="r_save" type="button">保存して送る</button></div></div>
    <p class="small muted" style="margin:12px 4px">Excel への書き出しと送付は PC で行います。直したところだけ送ります。</p>`;
}
function wireReport() {
  $('r_ym').querySelectorAll('button').forEach((b) => b.onclick = () => { RP_YM = b.dataset.ym; render(); });
  $('main').querySelectorAll('[data-k]').forEach((el) => el.addEventListener('input', () => { const n = $('main').querySelector(`[data-n="${el.dataset.k}"]`); if (n) n.textContent = el.value.length; }));
  $('r_save').onclick = async () => {
    const r = SNAP.月報[RP_YM];
    const fields = {};
    $('main').querySelectorAll('[data-k]').forEach((el) => { const k = el.dataset.k; const o = opOf(`mr|${RP_YM}|${k}`); const was = o ? o.value : ((r.欄 || {})[k] || {}).値 || ''; if (el.value !== was) fields[k] = el.value; });
    if (!Object.keys(fields).length) { toast('変わったところはありません'); return; }
    const at = Date.now();
    for (const [k, v] of Object.entries(fields)) { OPS = OPS.filter((o) => o.key !== `mr|${RP_YM}|${k}`); OPS.push({ key: `mr|${RP_YM}|${k}`, at, sent: false, value: v }); }
    saveLocal();
    await send({ 操作: '月報', ym: RP_YM, fields }, { done: '月報を送りました' });
    for (const k of Object.keys(fields)) { const o = opOf(`mr|${RP_YM}|${k}`); if (o) o.sent = OUTBOX.every((x) => !(x.body.操作 === '月報' && x.body.ym === RP_YM && k in x.body.fields)); }
    saveLocal(); render();
  };
}

/* ---------- はじまり ---------- */
(async function main() {
  $('reload').onclick = () => refresh(false);
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { TAB = b.dataset.tab; LS.set('tab', TAB); SHOW_ALL = false; render(); window.scrollTo(0, 0); });
  $('rcFile').addEventListener('change', (e) => { const fs = [...e.target.files]; e.target.value = ''; sendReceipts(fs); });
  window.addEventListener('online', () => refresh(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && LS.get('refresh', null)) refresh(true); });
  const u = new URL(location.href);
  if (u.searchParams.get('code')) {
    try { await finishLogin(u.searchParams.get('code'), u.searchParams.get('state')); } catch (e) { return renderLogin(e.message); }
  } else if (u.searchParams.get('error')) { history.replaceState(null, '', REDIRECT); return renderLogin('ログインをやめました'); }
  if (!LS.get('refresh', null)) return renderLogin();
  if (SNAP) render();
  refresh(true);
})();
