<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Hub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>SHC Work Hub</title>
<!--
  SHC Work Hub のスマホ版（勤務の入力）。データはこのページには置かない。
  読み書きするのは、自分の Dropbox の「Apps/SHC Work Hub」フォルダだけ（Dropbox の App folder の許可）。
    読む：/phone/snapshot.json（PC の SHC Work Hub が書く、前の3週間と次の1週間の勤務）
    書く：/inbox/<日時>.json（1件＝1日分の直し。PC が取り込む）
-->
<style>
:root{
  --bg:#f3f5f9; --surface:#fff; --ink:#172033; --ink-soft:#4a5468; --ink-faint:#7b8496; --line:#e2e6ee;
  --brand:#14213d; --accent:#2f6fde; --accent-soft:#e6eefc;
  --trip:#0f766e; --trip-soft:#e0f2ef; --work:#2f6fde; --work-soft:#e6eefc; --off:#7b8496; --off-soft:#eef0f4; --leave:#a15c07; --leave-soft:#fdf0dc;
  --warn:#b45309; --warn-soft:#fff4e0; --ok:#15803d; --err:#b91c1c;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#172033; --ink:#e8ecf4; --ink-soft:#b6bfd0; --ink-faint:#8791a6; --line:#2a3550;
  --brand:#0b1222; --accent:#6a9cf5; --accent-soft:#1e2c4a;
  --trip:#4fd1bf; --trip-soft:#123a36; --work:#6a9cf5; --work-soft:#1e2c4a; --off:#8791a6; --off-soft:#222b40; --leave:#f0b25a; --leave-soft:#3a2b12;
  --warn:#f0b25a; --warn-soft:#3a2b12; --ok:#4ade80; --err:#f87171;
}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#172033; --ink:#e8ecf4; --ink-soft:#b6bfd0; --ink-faint:#8791a6; --line:#2a3550;
  --brand:#0b1222; --accent:#6a9cf5; --accent-soft:#1e2c4a;
  --trip:#4fd1bf; --trip-soft:#123a36; --work:#6a9cf5; --work-soft:#1e2c4a; --off:#8791a6; --off-soft:#222b40; --leave:#f0b25a; --leave-soft:#3a2b12;
  --warn:#f0b25a; --warn-soft:#3a2b12; --ok:#4ade80; --err:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;flex:1;min-width:0}
header h1 small{display:block;font-size:11.5px;font-weight:400;opacity:.75}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;font-size:14px}
main{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(10,20,40,.05)}
.muted{color:var(--ink-faint)} .small{font-size:13px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.err{background:#fde8e8;color:var(--err)} .banner.ok{background:var(--accent-soft);color:var(--ink)}
.sec{font-size:13px;font-weight:700;color:var(--ink-soft);margin:16px 4px 8px;letter-spacing:.04em}
.day{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer}
.day:active{transform:scale(.995)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.d-date{width:52px;flex:none;text-align:center}
.d-date b{display:block;font-size:20px;line-height:1.1}
.d-date span{font-size:12px;color:var(--ink-faint)}
.d-date.sun span,.d-date.sat span{color:var(--err)}
.d-body{flex:1;min-width:0}
.d-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.k-出張{background:var(--trip-soft);color:var(--trip)} .k-出勤{background:var(--work-soft);color:var(--work)}
.k-休日{background:var(--off-soft);color:var(--off)} .k-有給休暇,.k-代休,.k-特別休暇{background:var(--leave-soft);color:var(--leave)}
.place{font-size:14px;font-weight:600}
.desc{font-size:14px;color:var(--ink-soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc.none{color:var(--warn)}
.st{font-size:12px;margin-top:4px;color:var(--ink-faint)}
.st.wait{color:var(--warn)} .st.sent{color:var(--accent)}
.ot{flex:none;text-align:right;font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
.ot b{color:var(--ink);font-size:14px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}
.more{width:100%;background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--ink-soft)}
/* 編集のシート */
.sheet-back{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 2px;font-size:18px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-size:14.5px;font-weight:600;min-height:44px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
textarea.t{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.step button{width:46px;height:46px;border:0;background:transparent;font-size:22px;font-weight:600;color:var(--accent)}
.step output{flex:1;text-align:center;font-weight:700;font-size:17px}
.hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#172033;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:30;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--err)}
.login{text-align:center;padding:28px 18px}
.login h2{margin:8px 0 6px}
.login ol{text-align:left;font-size:14px;color:var(--ink-soft);padding-left:20px}
</style>
</head>
<body>
<header>
  <h1>SHC Work Hub<small id="hsub">勤務の入力</small></h1>
  <button class="hbtn" id="reload" type="button" hidden>更新</button>
</header>
<main id="main"><div class="card muted">読み込み中…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== 設定（Dropbox に登録したアプリの App key。秘密の値ではない） ===== */
const APP_KEY = '';
/* ======================================================================= */
const REDIRECT = location.origin + location.pathname;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 保存場所：このスマホのブラウザだけ（ほかの人には見えない）。読めない設定のブラウザでも動くように try で囲む
const LS = { get(k, d) { try { const v = localStorage.getItem('wh.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('wh.' + k, JSON.stringify(v)); } catch { /* 保存できなくても動く */ } }, del(k) { try { localStorage.removeItem('wh.' + k); } catch { /* なし */ } } };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const localIso = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let toastT = null;
function toast(msg, kind) { const el = $('toast'); el.textContent = msg; el.className = 'toast' + (kind ? ' ' + kind : ''); el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, kind === 'err' ? 6000 : 2800); }

/* ---------- Dropbox のログイン（PKCE：パスワードはこのページを通らない） ---------- */
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function login() {
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
  try { sessionStorage.setItem('wh.pkce', JSON.stringify({ v, state })); } catch { /* なし */ }
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({ client_id: APP_KEY, response_type: 'code', code_challenge: ch, code_challenge_method: 'S256', redirect_uri: REDIRECT, token_access_type: 'offline', state });
}
async function finishLogin(code, state) {
  let p = null; try { p = JSON.parse(sessionStorage.getItem('wh.pkce') || 'null'); } catch { /* なし */ }
  history.replaceState(null, '', REDIRECT);
  if (!p || p.state !== state) throw new Error('ログインをやり直してください（途中で別の画面に移ったかもしれません）');
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ code, grant_type: 'authorization_code', code_verifier: p.v, client_id: APP_KEY, redirect_uri: REDIRECT }) });
  const j = await r.json();
  if (!r.ok) throw new Error('ログインできませんでした：' + (j.error_description || j.error || r.status));
  LS.set('refresh', j.refresh_token); TOKEN = { t: j.access_token, until: Date.now() + (j.expires_in - 120) * 1000 };
}
let TOKEN = null;
async function token() {
  if (TOKEN && Date.now() < TOKEN.until) return TOKEN.t;
  const rt = LS.get('refresh', null);
  if (!rt) throw Object.assign(new Error('ログインが必要です'), { login: true });
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: rt, client_id: APP_KEY }) });
  const j = await r.json();
  if (!r.ok) { if (r.status === 400 || r.status === 401) LS.del('refresh'); throw Object.assign(new Error('ログインし直してください'), { login: true }); }
  TOKEN = { t: j.access_token, until: Date.now() + (j.expires_in - 120) * 1000 };
  return TOKEN.t;
}
// Dropbox-API-Arg のヘッダーは ASCII だけ（日本語は \\u に直す）
const apiArg = (o) => JSON.stringify(o).replace(/[\u007f-￿]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
async function dbx(url, opts) {
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + await token(), ...(opts.headers || {}) } });
  if (r.status === 401) { TOKEN = null; throw Object.assign(new Error('ログインし直してください'), { login: true }); }
  return r;
}
async function download(path) {
  const r = await dbx('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { 'Dropbox-API-Arg': apiArg({ path }) } });
  if (r.status === 409) return null; // まだ無い
  if (!r.ok) throw new Error('Dropbox から読めませんでした（' + r.status + '）');
  return r.json();
}
async function upload(path, obj) {
  const r = await dbx('https://content.dropboxapi.com/2/files/upload', { method: 'POST', headers: { 'Dropbox-API-Arg': apiArg({ path, mode: 'add', autorename: true, mute: true }), 'Content-Type': 'application/octet-stream' }, body: new TextEncoder().encode(JSON.stringify(obj, null, 1)) });
  if (!r.ok) throw new Error('Dropbox に書けませんでした（' + r.status + '）');
}
async function inboxCount() {
  const r = await dbx('https://api.dropboxapi.com/2/files/list_folder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: '/inbox' }) });
  if (r.status === 409) return 0;
  if (!r.ok) return null;
  const j = await r.json();
  return j.entries.filter((e) => e['.tag'] === 'file' && /\.json$/i.test(e.name)).length;
}

/* ---------- データ ---------- */
let SNAP = LS.get('snap', null);   // PC が書いた写し（最後に読めたもの）
let MINE = LS.get('mine', {});     // このスマホで直した値 { date: { at, 勤務実績, sent } }（PC の写しに入るまで画面に出す）
let OUTBOX = LS.get('outbox', []); // まだ Dropbox に送れていないもの（電波が無いときなど）
let WAITING = null;                // PC がまだ取り込んでいない件数
let SHOW_ALL = false;
const KEYS = ['区分', '就業場所', '工番', '業務内容', '時間外勤務', '時間外移動', '出張中休日区分'];
function dayOf(date) {
  const base = (SNAP && SNAP.days.find((d) => d.date === date)) || { date, 区分: '', 就業場所: '', 工番: '', 業務内容: '', 時間外勤務: 0, 時間外移動: 0, 出張中休日区分: '' };
  const m = MINE[date];
  return m ? { ...base, ...m.勤務実績, _mine: m } : base;
}
// PC の写しに、このスマホの直しが入ったら、MINE から外す
function settleMine() {
  if (!SNAP) return;
  const snapAt = Date.parse(SNAP.作成) || 0;
  for (const [date, m] of Object.entries(MINE)) {
    const s = SNAP.days.find((d) => d.date === date);
    const same = s && Object.entries(m.勤務実績).every(([k, v]) => String(s[k] ?? '') === String(v ?? ''));
    if (m.sent && (same || (snapAt > m.at + 10 * 60 * 1000))) delete MINE[date];
  }
  LS.set('mine', MINE);
}
async function flushOutbox() {
  if (!OUTBOX.length) return;
  const left = [];
  for (const it of OUTBOX) {
    try { await upload(`/inbox/${it.name}`, it.body); if (MINE[it.body.date]) MINE[it.body.date].sent = true; } catch (e) { if (e.login) throw e; left.push(it); }
  }
  OUTBOX = left; LS.set('outbox', OUTBOX); LS.set('mine', MINE);
}
async function refresh(quiet) {
  try {
    await flushOutbox();
    const s = await download('/phone/snapshot.json');
    if (s && Array.isArray(s.days)) { SNAP = s; LS.set('snap', SNAP); }
    WAITING = await inboxCount();
    settleMine();
    render();
    if (!quiet) toast('最新にしました');
  } catch (e) {
    if (e.login) return renderLogin();
    render(); toast(navigator.onLine ? e.message : '電波がありません。直した分は、つながったら送ります', 'err');
  }
}

/* ---------- 画面 ---------- */
function renderLogin(msg) {
  $('reload').hidden = true;
  $('main').innerHTML = `<div class="card login">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    <h2>Dropbox でログイン</h2>
    <p class="muted small">PC の SHC Work Hub と、Dropbox の「Apps/SHC Work Hub」フォルダを通してやり取りします。ほかのフォルダには触りません。</p>
    ${msg ? `<div class="banner err">${esc(msg)}</div>` : ''}
    ${APP_KEY ? '<button class="btn primary block" id="loginBtn" type="button">Dropbox でログインする</button>' : '<div class="banner warn">まだ準備中です（Dropbox のアプリの App key が入っていません）</div>'}
    <ol><li>Dropbox の画面で「許可」を押します</li><li>この画面に戻ってきたら、ホーム画面に追加すると、アプリのように開けます</li></ol>
  </div>`;
  if ($('loginBtn')) $('loginBtn').onclick = () => login().catch((e) => toast(e.message, 'err'));
}
const kubunChip = (k) => k ? `<span class="chip k-${esc(k)}">${esc(k)}</span>` : '<span class="chip k-休日">未入力</span>';
function dayCard(d, today) {
  const dt = new Date(d.date + 'T00:00:00');
  const wd = dt.getDay();
  const work = d.区分 === '出勤' || d.区分 === '出張';
  const m = d._mine;
  const st = m ? (m.sent ? `<div class="st sent">送りました（PC が取り込むのを待っています）</div>` : `<div class="st wait">まだ送っていません（つながったら送ります）</div>`) : '';
  return `<button class="day${d.date === today ? ' today' : ''}" data-date="${d.date}" type="button">
    <div class="d-date ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}"><b>${dt.getDate()}</b><span>${dt.getMonth() + 1}月 ${WD[wd]}</span></div>
    <div class="d-body"><div class="d-top">${kubunChip(d.区分)}${work && d.就業場所 ? `<span class="place">${esc(d.就業場所)}</span>` : ''}${d.工番 ? `<span class="muted small">${esc(d.工番)}</span>` : ''}</div>
      ${work ? `<div class="desc${d.業務内容 ? '' : ' none'}">${d.業務内容 ? esc(d.業務内容) : '業務内容がまだです'}</div>` : ''}${st}</div>
    ${work ? `<div class="ot">時間外<br><b>${Number(d.時間外勤務 || 0).toFixed(1)}</b>${Number(d.時間外移動 || 0) ? `<br>移動 ${Number(d.時間外移動).toFixed(1)}` : ''}</div>` : ''}
  </button>`;
}
function render() {
  $('reload').hidden = false;
  const today = localIso();
  if (SNAP && SNAP.名前) $('hsub').textContent = SNAP.名前 + ' ・ 勤務の入力';
  const top = [];
  if (!SNAP) top.push('<div class="banner warn">PC の SHC Work Hub がまだ写しを作っていません。PC で SHC Work Hub を一度開いてから「更新」を押してください。</div>');
  else {
    const age = (Date.now() - Date.parse(SNAP.作成)) / 3600000;
    top.push(`<div class="small muted" style="margin:0 4px 8px">PC の写し：${new Date(SNAP.作成).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}${age > 24 ? '（1日以上前。PC を開くと新しくなります）' : ''}${WAITING ? ` ・ PC の取り込み待ち ${WAITING} 件` : ''}</div>`);
  }
  if (OUTBOX.length) top.push(`<div class="banner warn">まだ送っていない直しが ${OUTBOX.length} 件あります。つながったら「更新」で送ります。</div>`);
  const dates = SNAP ? SNAP.days.map((d) => d.date) : [today];
  const past = dates.filter((d) => d <= today).sort().reverse();
  const future = dates.filter((d) => d > today).sort();
  const shownPast = SHOW_ALL ? past : past.slice(0, 8);
  $('main').innerHTML = top.join('') +
    (future.length ? `<div class="sec">これから</div>${future.slice(0, 3).map((d) => dayCard(dayOf(d), today)).join('')}` : '') +
    `<div class="sec">今日と、これまで</div>` + shownPast.map((d) => dayCard(dayOf(d), today)).join('') +
    (past.length > shownPast.length ? '<button class="more" id="more" type="button">もっと前を見る</button>' : '') +
    `<p class="small muted" style="margin:16px 4px">直した分は Dropbox に送り、PC の SHC Work Hub が開いているとき（2分ごと）に取り込みます。PC で直したほうが新しければ、PC で上書きしてください。</p>
     <button class="more" id="logout" type="button">このスマホからログアウト</button>`;
  $('main').querySelectorAll('.day').forEach((b) => { b.onclick = () => openEditor(b.dataset.date); });
  if ($('more')) $('more').onclick = () => { SHOW_ALL = true; render(); };
  $('logout').onclick = () => { if (!confirm('このスマホから Dropbox のログインを外します。よいですか？')) return; LS.del('refresh'); TOKEN = null; renderLogin(); };
}
function openEditor(date) {
  const d = dayOf(date);
  const kinds = (SNAP && SNAP.区分の一覧) || ['出勤', '出張', '休日', '有給休暇', '代休', '特別休暇'];
  const hk = (SNAP && SNAP.出張中休日区分の一覧) || ['', '休日勤務', '休日移動', '休日介在', '日帰出張', 'その他'];
  const places = (SNAP && SNAP.就業場所の一覧) || [];
  const dt = new Date(date + 'T00:00:00');
  const v = { ...d };
  const back = document.createElement('div');
  back.className = 'sheet-back';
  back.innerHTML = `<div class="sheet" role="dialog" aria-label="${dt.getMonth() + 1}月${dt.getDate()}日の勤務">
    <h2>${dt.getMonth() + 1}月${dt.getDate()}日（${WD[dt.getDay()]}）</h2>
    <div class="small muted">直したところだけ PC に送ります</div>
    <label class="f">区分</label><div class="seg" id="e_kind">${kinds.map((k) => `<button type="button" data-k="${esc(k)}" class="${v.区分 === k ? 'on' : ''}">${esc(k)}</button>`).join('')}</div>
    <div id="e_work">
      <label class="f" for="e_place">就業場所</label><input class="t" id="e_place" list="e_places" value="${esc(v.就業場所)}" autocomplete="off"><datalist id="e_places">${['社内', ...places.filter((p) => p !== '社内')].map((p) => `<option value="${esc(p)}">`).join('')}</datalist>
      <label class="f" for="e_prj">工番</label><input class="t" id="e_prj" value="${esc(v.工番)}" placeholder="PRJ4854" autocapitalize="characters" autocomplete="off">
      <label class="f" for="e_desc">業務内容</label><textarea class="t" id="e_desc" placeholder="例：ラベラ不具合対応、生産立会">${esc(v.業務内容)}</textarea>
      <div class="hint">出勤表の「業務内容」に入ります。長いと Excel では小さい字になります。</div>
      <div class="row2">
        <div><label class="f">時間外 勤務</label><div class="step"><button type="button" data-s="時間外勤務" data-d="-0.5" aria-label="減らす">−</button><output id="o_時間外勤務"></output><button type="button" data-s="時間外勤務" data-d="0.5" aria-label="増やす">＋</button></div></div>
        <div><label class="f">時間外 移動</label><div class="step"><button type="button" data-s="時間外移動" data-d="-0.5" aria-label="減らす">−</button><output id="o_時間外移動"></output><button type="button" data-s="時間外移動" data-d="0.5" aria-label="増やす">＋</button></div></div>
      </div>
    </div>
    <label class="f" for="e_hk">出張中休日区分</label><select class="t" id="e_hk">${hk.map((k) => `<option value="${esc(k)}" ${v.出張中休日区分 === k ? 'selected' : ''}>${k ? esc(k) : '（なし）'}</option>`).join('')}</select>
    <div class="actions"><button class="btn" id="e_cancel" type="button">やめる</button><button class="btn primary" id="e_save" type="button">保存して送る</button></div>
  </div>`;
  document.body.appendChild(back);
  const q = (s) => back.querySelector(s);
  const showOt = () => ['時間外勤務', '時間外移動'].forEach((k) => { q('#o_' + k).textContent = Number(v[k] || 0).toFixed(1); });
  const showWork = () => { q('#e_work').style.display = v.区分 === '出勤' || v.区分 === '出張' ? '' : 'none'; };
  showOt(); showWork();
  q('#e_kind').querySelectorAll('button').forEach((b) => b.onclick = () => { v.区分 = b.dataset.k; q('#e_kind').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); if (v.区分 === '出張' && !q('#e_place').value) q('#e_place').focus(); showWork(); });
  back.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { const k = b.dataset.s; v[k] = Math.max(0, Math.min(24, Math.round((Number(v[k] || 0) + Number(b.dataset.d)) * 2) / 2)); showOt(); });
  const close = () => back.remove();
  q('#e_cancel').onclick = close;
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  q('#e_save').onclick = async () => {
    v.就業場所 = q('#e_place').value.trim(); v.工番 = q('#e_prj').value.trim().toUpperCase(); v.業務内容 = q('#e_desc').value.trim(); v.出張中休日区分 = q('#e_hk').value;
    const base = (SNAP && SNAP.days.find((x) => x.date === date)) || {};
    const prev = MINE[date] ? MINE[date].勤務実績 : {};
    const edits = {};
    for (const k of KEYS) { const now = v[k], was = k in prev ? prev[k] : base[k]; if (String(now ?? '') !== String(was ?? '')) edits[k] = now; }
    if (!Object.keys(edits).length) { close(); toast('変わったところはありません'); return; }
    const at = Date.now();
    MINE[date] = { at, sent: false, 勤務実績: { ...prev, ...edits } };
    const stamp = new Date(at).toISOString().replace(/[-:]/g, '').replace(/\..*/, '');
    const body = { 種類: 'SHC Work Hub スマホの入力', 形式版: 1, 作成: new Date(at).toISOString(), date, 勤務実績: edits };
    OUTBOX.push({ name: `${stamp}_${date}_${Math.random().toString(36).slice(2, 7)}.json`, body });
    LS.set('mine', MINE); LS.set('outbox', OUTBOX);
    close(); render();
    try { await flushOutbox(); render(); toast('送りました。PC の SHC Work Hub が開いているときに入ります'); }
    catch (e) { if (e.login) return renderLogin('ログインし直してください。直した分は、このスマホに残っています'); toast('送れませんでした。つながったら「更新」で送ります', 'err'); }
  };
}

/* ---------- はじまり ---------- */
(async function main() {
  $('reload').onclick = () => refresh(false);
  window.addEventListener('online', () => refresh(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && LS.get('refresh', null)) refresh(true); });
  const u = new URL(location.href);
  if (u.searchParams.get('code')) {
    try { await finishLogin(u.searchParams.get('code'), u.searchParams.get('state')); } catch (e) { return renderLogin(e.message); }
  } else if (u.searchParams.get('error')) { history.replaceState(null, '', REDIRECT); return renderLogin('ログインをやめました'); }
  if (!APP_KEY || !LS.get('refresh', null)) return renderLogin();
  if (SNAP) render();
  refresh(true);
})();
</script>
</body>
</html>
